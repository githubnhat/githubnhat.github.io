<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --soft-pink: #ffb3c1;
            --dark-pink: #c9184a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #16000a 0%, #3a0ca3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hiệu ứng trái tim bay phía sau */
        .background-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .heart-particle {
            position: absolute;
            color: var(--primary-pink);
            font-size: 20px;
            opacity: 0.6;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Khung nội dung chính */
        .container {
            z-index: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 3rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: white;
            font-size: clamp(2.5rem, 8vw, 4rem);
            margin-bottom: 1rem;
            text-shadow: 0 0 10px var(--primary-pink);
        }

        p {
            color: var(--soft-pink);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        /* Nút bấm chuyển trang */
        .btn-open {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
            text-transform: uppercase;
        }

        .btn-open:hover {
            transform: scale(1.1);
            background: var(--dark-pink);
            box-shadow: 0 0 30px var(--primary-pink);
        }
        .btn-open:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>

    <div class="background-hearts" id="heartsContainer"></div>

    <div class="container">
        <h1>Gửi cục dàng Hồng Gấm</h1>
        <p>Valentine's Day ❤️</p>
        <a href="trai-tim-2.html" class="btn-open">Bấm dô đây nè!</a>
    </div>

    <script>
        // Tạo hiệu ứng trái tim bay ngẫu nhiên
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';
            
            const startX = Math.random() * 100;
            const size = Math.random() * (30 - 10) + 10;
            const duration = Math.random() * (8 - 4) + 4;

            heart.style.left = startX + 'vw';
            heart.style.fontSize = size + 'px';
            heart.style.animationDuration = duration + 's';
            heart.style.opacity = Math.random();

            container.appendChild(heart);

            // Xóa trái tim sau khi bay xong để tránh nặng web
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Tạo trái tim mỗi 300ms
        setInterval(createHeart, 300);
    </script>
</body>
</html>
