<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>I Love You</title>
    <style>
        *{ margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow: hidden; background-color: #000 !important; width: 100%; height: 100%; }
        body { -webkit-font-smoothing: antialiased; }
        .webgl { position: fixed; width: 100%; height: 100%; top: 0; left: 0; outline: none; }
        #instruction {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8); font-family: sans-serif; font-size: 1.1rem;
            text-align: center; width: 100%; z-index: 10; pointer-events: none;
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        button { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: transparent; border: none; cursor: pointer; z-index: 20; }
    </style>
</head>
<body>
    <h1 id="instruction">Chạm vào màn hình để bắt đầu</h1>
    <canvas class="webgl"></canvas>
    <button id="play-music" type="button"></button>

    <script type="x-shader/x-vertex" id="vertexShader">
        #define M_PI 3.1415926535897932384626433832795
        uniform float uTime;
        uniform float uSize;
        attribute float aScale;
        attribute vec3 aColor;
        attribute float random;
        attribute float random1;
        attribute float aSpeed;
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float sign = 2.0* (step(random, 0.5) -.5);
            float t = sign*mod(-uTime * aSpeed* 0.005 + 10.0*aSpeed*aSpeed, M_PI);
            float a = pow(t, 2.0) * pow((t - sign * M_PI), 2.0);
            float radius = 0.14;
            vec3 myOffset = vec3(radius *16.0 * pow(sin(t), 2.0) * sin(t), radius * (13.0 * cos(t) - 5.0 * cos(2.0 * t) - 2.0 * cos(3.0 * t) - cos(4.0 * t)), .15*(a*(random1 - .5))*sin(abs(10.0*(sin(.2*uTime + .2*random)))*t));
            vec4 modelPosition = modelMatrix * vec4(myOffset, 1.0);
            vec4 viewPosition = viewMatrix * modelPosition;
            viewPosition.xyz += position * aScale * uSize * pow(a, .5) * .5;
            gl_Position = projectionMatrix * viewPosition;
            vColor = aColor;
            vUv = uv;
        }
    </script>

    <script type="x-shader/x-vertex" id="vertexShader1">
        #define M_PI 3.1415926535897932384626433832795
        uniform float uTime;
        uniform float uSize;
        attribute float aScale;
        attribute vec3 aColor;
        attribute float phi;
        attribute float random;
        attribute float random1;
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float angle = phi;
            float t = mod((-uTime + 100.0) * 0.06* random1 + random *2.0 * M_PI , 2.0 * M_PI);
            vec3 myOffset = vec3(5.85*cos(angle * t), 2.0*(t - M_PI), 3.0*sin(angle * t/t));
            vec4 modelPosition = modelMatrix * vec4(myOffset, 1.0);
            vec4 viewPosition = viewMatrix * modelPosition;
            viewPosition.xyz += position * aScale * uSize;
            gl_Position = projectionMatrix * viewPosition;
            vColor = aColor;
            vUv = uv;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentShader">
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float strength = distance(vUv, vec2(0.5));
            strength = 1.0 - strength * 2.0;
            gl_FragColor = vec4(strength * vColor, 1.0);
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentShader1">
        uniform sampler2D uTex;
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float strength = distance(vUv, vec2(0.5, .65));
            strength = 1.0 - strength * 2.0;
            vec3 tex = texture2D(uTex, vUv).rgb;
            gl_FragColor = vec4(tex * vColor * (strength + .3), 1.);
        }
    </script>

    <script type="module">
        import * as THREE from "https://cdn.skypack.dev/three@0.135.0";
        import { gsap } from "https://cdn.skypack.dev/gsap@3.8.0";
        import { GLTFLoader } from "https://cdn.skypack.dev/three@0.135.0/examples/jsm/loaders/GLTFLoader";

        class World {
            constructor({ canvas }) {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x16000a);
                this.clock = new THREE.Clock();
                
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.aspect = this.width / this.height;

                // Tăng FOV và lùi Camera xa hơn để bao quát vệ tinh trên màn hình dọc
                this.camera = new THREE.PerspectiveCamera(75, this.aspect, 0.1, 100);
                this.camera.position.set(0, 0, this.aspect < 1 ? 9 : 5); 

                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setSize(this.width, this.height);

                this.data = 0;
                this.angle = { x: 0, z: 0 };
                this.init();
            }

            init() {
                this.addModel();
                this.addHeart();
                this.addSnow();
                this.addButton();
                this.listenToResize();
                this.loop();
            }

            addButton() {
                const btn = document.querySelector("button");
                btn.addEventListener("click", () => {
                    btn.style.display = "none";
                    document.getElementById("instruction").style.display = "none";
                    this.loadMusic();
                });
            }

            async addModel() {
                new GLTFLoader().load("https://assets.codepen.io/74321/heart.glb", (res) => {
                    this.model = res.scene.children[0];
                    this.model.scale.set(0.01, 0.01, 0.01);
                    this.model.material = new THREE.MeshMatcapMaterial({
                        matcap: new THREE.TextureLoader().load("https://assets.codepen.io/74321/3.png", () => {
                            gsap.to(this.model.scale, { x: 0.35, y: 0.35, z: 0.35, duration: 1.5, ease: "Elastic.easeOut" });
                        }),
                        color: "#fff"
                    });
                    this.scene.add(this.model);
                });
            }

            addHeart() {
                this.heartMaterial = new THREE.ShaderMaterial({
                    fragmentShader: document.getElementById("fragmentShader").textContent,
                    vertexShader: document.getElementById("vertexShader").textContent,
                    uniforms: { uTime: { value: 0 }, uSize: { value: 0.2 } },
                    depthWrite: false, blending: THREE.AdditiveBlending, transparent: true
                });
                const count = 1500;
                const geo = new THREE.InstancedBufferGeometry();
                const plane = new THREE.PlaneGeometry(1, 1);
                Object.keys(plane.attributes).forEach(a => geo.setAttribute(a, plane.attributes[a]));
                geo.index = plane.index;

                const scales = new Float32Array(count);
                const colors = new Float32Array(count * 3);
                const speeds = new Float32Array(count);
                const randoms = new Float32Array(count);
                const randoms1 = new Float32Array(count);
                const colorChoices = ["white", "red", "pink", "crimson", "hotpink", "green", "aquamarine", "blue"];

                for (let i = 0; i < count; i++) {
                    randoms[i] = Math.random();
                    randoms1[i] = Math.random();
                    scales[i] = Math.random() * 0.35;
                    const c = new THREE.Color(colorChoices[Math.floor(Math.random() * colorChoices.length)]);
                    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
                    speeds[i] = Math.random() * 12.5 * Math.PI;
                }
                geo.setAttribute("random", new THREE.InstancedBufferAttribute(randoms, 1));
                geo.setAttribute("random1", new THREE.InstancedBufferAttribute(randoms1, 1));
                geo.setAttribute("aScale", new THREE.InstancedBufferAttribute(scales, 1));
                geo.setAttribute("aSpeed", new THREE.InstancedBufferAttribute(speeds, 1));
                geo.setAttribute("aColor", new THREE.InstancedBufferAttribute(colors, 3));
                this.scene.add(new THREE.Mesh(geo, this.heartMaterial));
            }

            addSnow() {
                this.snowMaterial = new THREE.ShaderMaterial({
                    fragmentShader: document.getElementById("fragmentShader1").textContent,
                    vertexShader: document.getElementById("vertexShader1").textContent,
                    uniforms: { uTime: { value: 0 }, uSize: { value: 0.3 }, uTex: { value: new THREE.TextureLoader().load("https://assets.codepen.io/74321/heart.png") } },
                    depthWrite: false, blending: THREE.AdditiveBlending, transparent: true
                });
                const count = 550;
                const geo = new THREE.InstancedBufferGeometry();
                const plane = new THREE.PlaneGeometry(1, 1);
                Object.keys(plane.attributes).forEach(a => geo.setAttribute(a, plane.attributes[a]));
                geo.index = plane.index;

                const phis = new Float32Array(count);
                const randoms = new Float32Array(count);
                const randoms1 = new Float32Array(count);
                const scales = new Float32Array(count);
                const colors = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    phis[i] = (Math.random() - 0.5) * 10;
                    randoms[i] = Math.random();
                    randoms1[i] = Math.random();
                    scales[i] = Math.random() * 0.35;
                    const c = new THREE.Color(["red", "pink", "hotpink", "green", "aquamarine", "blue"][Math.floor(Math.random()*6)]);
                    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
                }
                geo.setAttribute("phi", new THREE.InstancedBufferAttribute(phis, 1));
                geo.setAttribute("random", new THREE.InstancedBufferAttribute(randoms, 1));
                geo.setAttribute("random1", new THREE.InstancedBufferAttribute(randoms1, 1));
                geo.setAttribute("aScale", new THREE.InstancedBufferAttribute(scales, 1));
                geo.setAttribute("aColor", new THREE.InstancedBufferAttribute(colors, 3));
                this.scene.add(new THREE.Mesh(geo, this.snowMaterial));
            }

            loadMusic() {
                const listener = new THREE.AudioListener();
                this.camera.add(listener);
                this.sound = new THREE.Audio(listener);
                new THREE.AudioLoader().load("source/music_ji3iak.mp3", (buffer) => {
                    this.sound.setBuffer(buffer);
                    this.sound.play();
                    this.analyser = new THREE.AudioAnalyser(this.sound, 32);
                    this.isRunning = true;
                });
            }

            listenToResize() {
                window.addEventListener("resize", () => {
                    this.width = window.innerWidth;
                    this.height = window.innerHeight;
                    this.aspect = this.width / this.height;
                    this.camera.aspect = this.aspect;
                    this.camera.position.z = this.aspect < 1 ? 9 : 5;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(this.width, this.height);
                });
            }

            loop() {
                const time = this.clock.getElapsedTime();

                if (this.analyser && this.isRunning) {
                    // Dữ liệu nhạc nguyên bản từ file của bạn
                    this.data = this.analyser.getAverageFrequency() / 2000 * this.analyser.getAverageFrequency();
                    this.angle.x += 0.01;
                    this.angle.z += 0.005;

                    // KHỐI PHỤC DI CHUYỂN CAMERA CỦA FILE GỐC
                    // Nhưng thêm giới hạn z an toàn cho iPhone
                    this.camera.position.x = Math.sin(this.angle.x) * 2;
                    
                    // Khi nhạc mạnh (data lớn), camera lùi xa hơn một chút để không bị tràn
                    const dynamicZ = (this.aspect < 1 ? 9 : 4.5) + this.data * 0.5;
                    this.camera.position.z = Math.min(Math.max(Math.cos(this.angle.z) * dynamicZ, 1.75), 9.0);
                }

                this.camera.lookAt(this.scene.position);
                
                // Hiệu ứng Shader (giữ nguyên logic gốc)
                if (this.heartMaterial) this.heartMaterial.uniforms.uTime.value += 0.01 * (1 + this.data * 0.2);
                if (this.model) this.model.rotation.y -= 0.008 * (1 + this.data);
                if (this.snowMaterial) this.snowMaterial.uniforms.uTime.value += 0.007 * (1 + this.data);

                this.renderer.render(this.scene, this.camera);
                requestAnimationFrame(this.loop.bind(this));
            }
        }
        new World({ canvas: document.querySelector("canvas.webgl") });
    </script>
</body>
</html>
