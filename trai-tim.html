<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>I Love You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            width: 100%; 
            height: 100dvh; /* Sử dụng Dynamic Viewport Height cho iOS */
            overflow: hidden; 
            background-color: #16000a !important;
            position: fixed; /* Chống bounce/scroll trên iPhone */
        }
        .webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            outline: none;
        }
        #instruction {
            position: absolute;
            bottom: calc(15% + env(safe-area-inset-bottom));
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 10;
            font-family: -apple-system, system-ui, sans-serif;
        }
        button { display: none; }
    </style>
</head>
<body>
    <div id="instruction">CHẠM ĐỂ BẮT ĐẦU</div>
    <canvas class="webgl"></canvas>

    <script type="x-shader/x-vertex" id="vertexShader">
        #define M_PI 3.1415926535897932384626433832795
        uniform float uTime;
        uniform float uSize;
        attribute float aScale;
        attribute vec3 aColor;
        attribute float random;
        attribute float random1;
        attribute float aSpeed;
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float sign = 2.0* (step(random, 0.5) -.5);
            float t = sign*mod(-uTime * aSpeed* 0.005 + 10.0*aSpeed*aSpeed, M_PI);
            float a = pow(t, 2.0) * pow((t - sign * M_PI), 2.0);
            float radius = 0.14;
            vec3 myOffset = vec3(radius *16.0 * pow(sin(t), 2.0) * sin(t), radius * (13.0 * cos(t) - 5.0 * cos(2.0 * t) - 2.0 * cos(3.0 * t) - cos(4.0 * t)), .15*(a*(random1 - .5))*sin(abs(10.0*(sin(.2*uTime + .2*random)))*t));
            vec4 modelPosition = modelMatrix * vec4(myOffset, 1.0);
            vec4 viewPosition = viewMatrix * modelPosition;
            viewPosition.xyz += position * aScale * uSize * pow(a, .5) * .5;
            gl_Position = projectionMatrix * viewPosition;
            vColor = aColor;
            vUv = uv;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentShader">
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float strength = 1.0 - (distance(vUv, vec2(0.5)) * 2.0);
            gl_FragColor = vec4(strength * vColor, 1.0);
        }
    </script>
    <script type="x-shader/x-vertex" id="vertexShader1">
        #define M_PI 3.1415926535897932384626433832795
        uniform float uTime;
        uniform float uSize;
        attribute float aScale;
        attribute vec3 aColor;
        attribute float phi;
        attribute float random;
        attribute float random1;
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float t = mod((-uTime + 100.0) * 0.06* random1 + random *2.0 * M_PI , 2.0 * M_PI);
            vec3 myOffset = vec3(5.85*cos(phi * t), 2.0*(t - M_PI), 3.0*sin(phi * t/t));
            vec4 viewPosition = viewMatrix * modelMatrix * vec4(myOffset, 1.0);
            viewPosition.xyz += position * aScale * uSize;
            gl_Position = projectionMatrix * viewPosition;
            vColor = aColor;
            vUv = uv;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentShader1">
        uniform sampler2D uTex;
        varying vec3 vColor;
        varying vec2 vUv;
        void main() {
            float strength = 1.0 - (distance(vUv, vec2(0.5, .65)) * 2.0);
            vec3 texColor = texture2D(uTex, vUv).rgb;
            gl_FragColor = vec4(texColor * vColor * (strength + .3), 1.0);
        }
    </script>

    <script type="module">
        import * as THREE from "https://cdn.skypack.dev/three@0.135.0";
        import { GLTFLoader } from "https://cdn.skypack.dev/three@0.135.0/examples/jsm/loaders/GLTFLoader";

        class World {
            constructor({ canvas }) {
                this.canvas = canvas;
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x16000a);
                this.clock = new THREE.Clock();
                
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                
                // Điều chỉnh Camera FOV cho iPhone màn hình dài
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
                this.camera.position.z = 5;

                this.parameters = { count: 1500, max: 12.5 * Math.PI };
                this.time = { current: 0, delta: 0, frequency: 0.0005 };
                this.data = 0;
                this.isRunning = true;

                this.init();
            }

            async init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                this.addHeart();
                this.addSnow();
                await this.addModel();
                this.setupAudioTrigger();
                this.loop();
            }

            resize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                this.camera.aspect = width / height;
                // Tự động điều chỉnh khoảng cách trái tim cho màn hình Pro Max
                if (width < height) {
                    this.camera.position.z = 6;
                } else {
                    this.camera.position.z = 4.5;
                }
                
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            }

            render() {
                this.renderer.render(this.scene, this.camera);
            }

            setupAudioTrigger() {
                const ins = document.getElementById('instruction');
                const start = () => {
                    if (!this.sound) {
                        const listener = new THREE.AudioListener();
                        this.camera.add(listener);
                        this.sound = new THREE.Audio(listener);
                        new THREE.AudioLoader().load("source/music_ji3iak.mp3", (buffer) => {
                            this.sound.setBuffer(buffer);
                            this.sound.setLoop(true);
                            this.sound.play();
                            this.analyser = new THREE.AudioAnalyser(this.sound, 32);
                        });
                    }
                    if(ins) ins.style.opacity = '0';
                    window.removeEventListener('touchstart', start);
                    window.removeEventListener('click', start);
                };
                window.addEventListener('touchstart', start);
                window.addEventListener('click', start);
            }

            addHeart() {
                this.heartMaterial = new THREE.ShaderMaterial({
                    fragmentShader: document.getElementById("fragmentShader").textContent,
                    vertexShader: document.getElementById("vertexShader").textContent,
                    uniforms: { uTime: { value: 0 }, uSize: { value: 0.2 }, uTex: { value: new THREE.TextureLoader().load("https://assets.codepen.io/74321/heart.png") } },
                    depthWrite: false, blending: THREE.AdditiveBlending, transparent: true
                });
                const geo = new THREE.InstancedBufferGeometry();
                const plane = new THREE.PlaneGeometry(1, 1);
                Object.keys(plane.attributes).forEach(a => geo.attributes[a] = plane.attributes[a]);
                geo.index = plane.index;
                
                const count = this.parameters.count;
                const scales = new Float32Array(count), colors = new Float32Array(count * 3), speeds = new Float32Array(count), r1 = new Float32Array(count), r2 = new Float32Array(count);
                const colorChoices = ["white", "red", "pink", "crimson", "hotpink", "green", "aquamarine", "blue"];

                for (let i = 0; i < count; i++) {
                    scales[i] = Math.random() * 0.35;
                    const c = new THREE.Color(colorChoices[Math.floor(Math.random() * colorChoices.length)]);
                    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
                    speeds[i] = Math.random() * this.parameters.max;
                    r1[i] = Math.random(); r2[i] = Math.random();
                }
                geo.setAttribute("aScale", new THREE.InstancedBufferAttribute(scales, 1));
                geo.setAttribute("aColor", new THREE.InstancedBufferAttribute(colors, 3));
                geo.setAttribute("aSpeed", new THREE.InstancedBufferAttribute(speeds, 1));
                geo.setAttribute("random", new THREE.InstancedBufferAttribute(r1, 1));
                geo.setAttribute("random1", new THREE.InstancedBufferAttribute(r2, 1));
                this.scene.add(new THREE.Mesh(geo, this.heartMaterial));
            }

            addSnow() {
                this.snowMaterial = new THREE.ShaderMaterial({
                    fragmentShader: document.getElementById("fragmentShader1").textContent,
                    vertexShader: document.getElementById("vertexShader1").textContent,
                    uniforms: { uTime: { value: 0 }, uSize: { value: 0.3 }, uTex: { value: new THREE.TextureLoader().load("https://assets.codepen.io/74321/heart.png") } },
                    depthWrite: false, blending: THREE.AdditiveBlending, transparent: true
                });
                const geo = new THREE.InstancedBufferGeometry();
                const plane = new THREE.PlaneGeometry(1, 1);
                Object.keys(plane.attributes).forEach(a => geo.attributes[a] = plane.attributes[a]);
                geo.index = plane.index;

                const count = 450;
                const scales = new Float32Array(count), colors = new Float32Array(count * 3), phis = new Float32Array(count), r1 = new Float32Array(count), r2 = new Float32Array(count);
                for (let i = 0; i < count; i++) {
                    phis[i] = (Math.random() - 0.5) * 10;
                    r1[i] = Math.random(); r2[i] = Math.random();
                    scales[i] = Math.random() * 0.35;
                    const c = new THREE.Color(["red", "pink", "hotpink", "blue"][Math.floor(Math.random()*4)]);
                    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
                }
                geo.setAttribute("phi", new THREE.InstancedBufferAttribute(phis, 1));
                geo.setAttribute("random", new THREE.InstancedBufferAttribute(r1, 1));
                geo.setAttribute("random1", new THREE.InstancedBufferAttribute(r2, 1));
                geo.setAttribute("aScale", new THREE.InstancedBufferAttribute(scales, 1));
                geo.setAttribute("aColor", new THREE.InstancedBufferAttribute(colors, 3));
                this.scene.add(new THREE.Mesh(geo, this.snowMaterial));
            }

            async addModel() {
                return new Promise(res => {
                    new GLTFLoader().load("https://assets.codepen.io/74321/heart.glb", (gltf) => {
                        this.model = gltf.scene.children[0];
                        this.model.material = new THREE.MeshMatcapMaterial({
                            matcap: new THREE.TextureLoader().load("https://assets.codepen.io/74321/3.png"),
                            color: "#fff"
                        });
                        this.model.scale.set(0.35, 0.35, 0.35);
                        this.scene.add(this.model);
                        res();
                    });
                });
            }

            loop() {
                const elapsed = this.clock.getElapsedTime();
                this.time.delta = (elapsed - this.time.current) * 1000;
                this.time.current = elapsed;

                if (this.analyser) {
                    this.data = this.analyser.getAverageFrequency() / 100;
                }

                if (this.heartMaterial) this.heartMaterial.uniforms.uTime.value += this.time.delta * this.time.frequency * (1 + this.data);
                if (this.model) this.model.rotation.y -= 0.001 * this.time.delta * (1 + this.data);
                if (this.snowMaterial) this.snowMaterial.uniforms.uTime.value += this.time.delta * 0.0004 * (1 + this.data);

                this.render();
                requestAnimationFrame(() => this.loop());
            }
        }

        new World({ canvas: document.querySelector("canvas.webgl") });
    </script>
</body>
</html>
